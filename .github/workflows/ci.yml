name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abro
          POSTGRES_PASSWORD: password
          POSTGRES_DB: abro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abro -d abro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # apps/api's integration tests hit this DB directly, matching how
      # they're run and verified locally -- see docs/DECISIONS.md and each
      # module's *.service.spec.ts (no mocked Prisma anywhere in this repo).
      DATABASE_URL: postgresql://abro:password@localhost:5432/abro
      # docs/DECISIONS.md ADR-006 -- receipt storage tests hit real MinIO,
      # started below (not a `services:` container: the minio/minio image's
      # default CMD has no arguments, and GitHub Actions' `services:` block
      # has no way to override CMD, only `options`).
      S3_ENDPOINT: http://localhost:9460
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: abro-minio
      S3_SECRET_ACCESS_KEY: password123
      RECEIPTS_BUCKET: abro-receipts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Start MinIO and provision the receipts bucket
        run: |
          docker run -d --name minio \
            -p 9460:9000 -p 9461:9001 \
            -e MINIO_ROOT_USER=abro-minio \
            -e MINIO_ROOT_PASSWORD=password123 \
            quay.io/minio/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            docker exec minio mc ready local && break
            sleep 1
          done
          docker exec minio mc alias set local http://localhost:9000 abro-minio password123
          docker exec minio mc mb --ignore-existing local/abro-receipts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
