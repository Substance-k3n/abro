name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abro
          POSTGRES_PASSWORD: password
          POSTGRES_DB: abro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abro -d abro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # apps/api's integration tests hit this DB directly, matching how
      # they're run and verified locally -- see docs/DECISIONS.md and each
      # module's *_integration_test.go (no mocked pgx anywhere in this repo).
      DATABASE_URL: postgres://abro:password@localhost:5432/abro?sslmode=disable
      # docs/DECISIONS.md ADR-008 -- receipt storage tests hit a real
      # S3-compatible server (RustFS), started below with `docker run`
      # rather than `services:` so the bucket can be provisioned in the
      # same step once it's healthy.
      S3_ENDPOINT: http://localhost:9460
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: abro-minio
      S3_SECRET_ACCESS_KEY: password123
      RECEIPTS_BUCKET: abro-receipts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'

      - name: Start RustFS and provision the receipts bucket
        run: |
          # RustFS runs as UID/GID 10001; a tmpfs owned by it avoids any
          # host-directory permission setup. Data is throwaway in CI.
          docker run -d --name s3 \
            -p 9460:9000 \
            --tmpfs /data:rw,uid=10001,gid=10001 \
            -e RUSTFS_VOLUMES=/data \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9460/health && break
            sleep 1
          done
          curl -fsS http://localhost:9460/health || { docker logs s3; exit 1; }
          # The runner image ships the AWS CLI; `mc` (MinIO's client) is gone.
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
          AWS_DEFAULT_REGION="$S3_REGION" \
            aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$RECEIPTS_BUCKET"

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
        working-directory: apps/api

      - name: Vet
        run: go vet ./...
        working-directory: apps/api

      - name: Apply migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -database "$DATABASE_URL" -path migrations up
        working-directory: apps/api

      - name: Test
        run: go test ./...
        working-directory: apps/api

      - name: Build
        run: go build ./...
        working-directory: apps/api
