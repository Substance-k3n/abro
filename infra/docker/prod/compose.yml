# Production stack for one VPS (docs/DECISIONS.md ADR-011,
# docs/DEPLOY.md). Everything runs on the server's private Docker
# network; only Caddy publishes ports (80/443, automatic HTTPS):
#   https://$APP_DOMAIN  -> web (Next.js)
#   https://$API_DOMAIN  -> api (Go)
# Postgres and the S3 store are never exposed.
#
# Usage (from this directory, with .env filled in from .env.example):
#   docker compose up -d --build     # build on the server, or
#   docker compose pull && docker compose up -d   # prebuilt images

name: abro

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - APP_DOMAIN
      - API_DOMAIN
      - ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    image: ${WEB_IMAGE:-abro-web:latest}
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-abro-api:latest}
    build:
      context: ../../../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
      PORT: '3201'
      WEB_ORIGIN: https://${APP_DOMAIN}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://${API_DOMAIN}/auth/google/callback
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      RECEIPTS_BUCKET: ${RECEIPTS_BUCKET:-abro-receipts}
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-createbuckets:
        condition: service_completed_successfully

  # One-shot: applies the migrations baked into the api image, then
  # exits. The api only starts once this succeeded, so code and schema
  # always come from the same image.
  migrate:
    image: ${API_IMAGE:-abro-api:latest}
    command: ['/app/migrate', '-path', '/app/migrations', '-database', *database-url, 'up']
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data

  # Daily pg_dump into ./backups (on the host), keeping 14 days. Copy
  # them off the server too -- see docs/DEPLOY.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c '
      while true; do
        pg_dump -Fc -f /backups/abro-$$(date +%Y%m%d-%H%M).dump &&
        find /backups -name "abro-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy

  # Receipt storage (ADR-008), same setup as infra/docker/dev.
  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      s3-volume-permissions:
        condition: service_completed_successfully
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - s3-data:/data

  s3-volume-permissions:
    image: alpine:3.20
    command: chown -R 10001:10001 /data
    volumes:
      - s3-data:/data

  s3-createbuckets:
    image: amazon/aws-cli:2.27.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - RECEIPTS_BUCKET=${RECEIPTS_BUCKET:-abro-receipts}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$RECEIPTS_BUCKET ||
      aws --endpoint-url http://s3:9000 s3 mb s3://$$RECEIPTS_BUCKET
      "

volumes:
  database:
  s3-data:
  caddy-data:
  caddy-config:
