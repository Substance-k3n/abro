name: abro-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-abro-db}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-abro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-abro}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abro} -d ${POSTGRES_DB:-abro}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT:-5460}:5432'
    volumes:
      - database:/var/lib/postgresql/data

  # docs/DECISIONS.md ADR-008 (superseding ADR-006's MinIO choice):
  # receipt storage, S3-compatible, self-hosted. RustFS -- MinIO's images
  # are no longer publicly pullable and its repo is archived. apps/api
  # still talks to it through minio-go, a generic S3 client.
  s3:
    image: rustfs/rustfs:1.0.0
    container_name: ${S3_CONTAINER_NAME:-abro-s3}
    restart: always
    depends_on:
      s3-volume-permissions:
        condition: service_completed_successfully
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Same defaults apps/api/.env.example and the integration tests use
      # (the `abro-minio` value predates the switch; kept so existing
      # .env files keep working).
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID:-abro-minio}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-password123}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${S3_API_PORT:-9460}:9000'
      - '${S3_CONSOLE_PORT:-9461}:9001'
    volumes:
      - s3-data:/data

  # One-shot: RustFS runs as a non-root user (UID/GID 10001), so a fresh
  # named volume must be chowned to it first -- same helper RustFS's own
  # docker-compose-simple.yml uses.
  s3-volume-permissions:
    image: alpine:3.20
    command: chown -R 10001:10001 /data
    volumes:
      - s3-data:/data

  # One-shot: provisions the receipts bucket on `docker compose up`, then
  # exits -- so apps/api never has to create-bucket-if-missing at runtime.
  # AWS CLI rather than MinIO's `mc`, whose image is gone too.
  s3-createbuckets:
    image: amazon/aws-cli:2.27.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-abro-minio}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-password123}
      - AWS_DEFAULT_REGION=us-east-1
      - RECEIPTS_BUCKET=${RECEIPTS_BUCKET:-abro-receipts}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$RECEIPTS_BUCKET ||
      aws --endpoint-url http://s3:9000 s3 mb s3://$$RECEIPTS_BUCKET
      "

volumes:
  database:
  s3-data:
