# Render Blueprint for the free-tier deploy (docs/DEPLOY.md "Free tier",
# docs/DECISIONS.md ADR-012): only apps/api runs here. The web app is on
# Vercel and Postgres on Neon. `sync: false` values are entered in the
# Render dashboard when the Blueprint is created, never committed.
services:
  - type: web
    name: abro-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    # Liveness only (no database query), so it's cheap to call often.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: 'true'
      - key: SESSION_TTL_DAYS
        value: '30'
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: WEB_ORIGIN # https://<project>.vercel.app
        sync: false
      - key: GOOGLE_CALLBACK_URL # https://<project>.vercel.app/api/auth/google/callback
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # OTP email without a domain (ADR-013): a Brevo API key and a sender
      # address verified in Brevo (e.g. your Gmail). Used if Resend is unset.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # Receipt storage (docs/DEPLOY.md "Free tier" -> Receipts): a private
      # S3-compatible bucket (Backblaze B2 in production) and a key scoped
      # to it. Leave all unset and receipt uploads answer 501.
      - key: S3_ENDPOINT # e.g. https://s3.<region>.backblazeb2.com
        sync: false
      - key: S3_REGION # the bucket's region, e.g. us-west-004
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RECEIPTS_BUCKET
        sync: false
