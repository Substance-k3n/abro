# Render Blueprint for the free-tier deploy (docs/DEPLOY.md "Free tier",
# docs/DECISIONS.md ADR-012): only apps/api runs here. The web app is on
# Vercel and Postgres on Neon. `sync: false` values are entered in the
# Render dashboard when the Blueprint is created, never committed.
services:
  - type: web
    name: abro-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: 'true'
      - key: SESSION_TTL_DAYS
        value: '30'
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: WEB_ORIGIN # https://<project>.vercel.app
        sync: false
      - key: GOOGLE_CALLBACK_URL # https://<project>.vercel.app/api/auth/google/callback
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
